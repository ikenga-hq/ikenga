reason = "Sets the cancel flag of an in-flight pkg_install_from_registry, which the daemon does not serve yet; it is served together with that command."

[pkg_install_from_path]
tag = "WP-18b"
reason = "materialize_npm_deps (npm/bun spawn) then kernel.install_from_path, whose SidecarSupervisor spawns long-lived MCP children."

[pkg_install_from_registry]
