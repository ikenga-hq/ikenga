[pkg_set_enabled]
tag = "desktop-only-forever"
reason = "kernel.set_enabled registers/unregisters every registry, incl. the SidecarSupervisor that spawns or kills the pkg's supervised child. The daemon has no pkg kernel or supervisor: its pkgs are the operator's read-only --pkgs-dir index (every one served, none toggleable), so there is nothing to enable or disable from a browser; the operator changes --pkgs-dir and restarts the daemon."

