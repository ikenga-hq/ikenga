[pkg_trust_list]
tag = "WP-19"
reason = "Walks kernel.list_installed() and evaluates each pkg against its trust row + app_data_dir; the daemon has no kernel install registry, so it would answer an empty list that reads as \"nothing needs trust\"."

[pkg_trust_preview]
tag = "WP-19"
reason = "Resolves the pkg via kernel.installed_summary() and summarizes its installed manifest's sensitive perms; the daemon has no kernel install registry, so every call would be \"not installed\"."

[pkg_trust_preview_incoming]
tag = "WP-19"
reason = "Diffs an incoming manifest against the cap_snapshot row, falling back to kernel.installed_summary()'s manifest; only meaningful to the kernel install flow that parks a changed pkg, which the daemon (no kernel, installs nothing) does not have."

[pkg_trust_reject]
tag = "WP-18b"
reason = "kernel.uninstall() unregisters every registry, tearing down SidecarSupervisor/MCP child processes (desktop-only spawn site)."

[pkg_trust_revoke]
tag = "WP-19"
reason = "Deletes the pkg_trust row that only the desktop's trust::evaluate reads (elevated-verb gating via resolve_elevated_trust, pkg_mcp, the trust list) — all of which need the kernel's installed set; the daemon has no kernel or trust evaluation, so serving it would write state nothing on the daemon consults. Held with the pkg_trust family until the daemon has a trust model."

[pkg_uninstall]
tag = "desktop-only-forever"
reason = "kernel.uninstall walks registries.unregister(), whose SidecarSupervisor kills the pkg's child, and deletes the install. The daemon installs nothing and has no kernel or supervisor; its --pkgs-dir is the operator's read-only directory, which a principal child cannot write. Removing a pkg is an operator action on that directory plus a daemon restart."

