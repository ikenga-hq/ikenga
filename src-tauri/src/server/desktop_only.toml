# Tauri commands the headless daemon (`server/rpc.rs`) does NOT serve, and why.
#
# Enforced by `src-tauri/src/server/parity.rs` (a `cargo test`, both feature
# sets): every command in `lib.rs`'s `tauri::generate_handler![...]` must be
# EITHER served by an arm of `rpc.rs`'s `match payload.cmd.as_str()` OR listed
# here — never both, never neither. A stale entry (not a Tauri command any
# more) fails too.
#
# One table per command, so TOML itself rejects a duplicate:
#
#   [command_name]
#   tag = "WP-19"
#   reason = "one line, why it is not served yet / ever"
#
# Tags:
#   WP-19                 pure read / local-file work the daemon can serve; pending.
#   WP-18b                spawns a process outside the session executor; needs
#                         executor::current() routing before the daemon may serve it.
#   WP-20                 touches per-user state (vault, identity) that needs
#                         principal scoping (G-PRINCIPAL) first.
#   desktop-only-forever  native window / webview / OS-shell behaviour with no
#                         daemon or browser meaning.
#
# RATCHET: this file only ever shrinks. Serving a command means adding its
# `rpc.rs` arm AND deleting its table here in the same change. Adding a table
# is only for a NEW Tauri command, with an honest tag and reason.

[actions_open_file]
tag = "desktop-only-forever"
reason = "manager.open_file -> open_path spawns explorer.exe/open/xdg-open — native open-in-OS-app, same as settings_open_file."

[app_lock_clear_secret]
tag = "WP-20"
reason = "Clears the one shared PIN record after verify_secret; same single-tenant AppLockState as the rest of the family."

[app_lock_configure]
tag = "WP-20"
reason = "Writes the one AppLockConfig (idle_enabled/method) shared app-wide; no per-principal config exists."

[app_lock_lock]
tag = "WP-20"
reason = "Locks the single shared AppLockState for the whole app; one user's lock would freeze every remote client."

[app_lock_set_secret]
tag = "WP-20"
reason = "hash_secret/verify_secret write the PIN record in app-lock.json (its own argon2id hash, not the secrets store, so WP-21's per-principal store does not unblock it). The FE disables app lock in a remote web session (tauri-cmd.ts appLockStatus -> null) and the daemon cannot push app-lock://changed; serving the family needs a per-child app-lock.json, an idle ticker and an FE remote mode together."

[app_lock_status]
tag = "WP-20"
reason = "Reads single global AppLockState (one PIN gates the whole app); needs per-principal state before a multi-user daemon can serve it."

[app_lock_touch]
tag = "WP-20"
reason = "Bumps the one global AppLockState.last_activity_ms; single-tenant idle clock, no principal dimension."

[app_lock_unlock]
tag = "WP-20"
reason = "Verifies the PIN against the SecretRecord in app-lock.json (not the secrets store; WP-21 does not unblock it). Same gap as app_lock_set_secret: FE remote mode, a per-child app-lock.json and a daemon idle ticker are needed together."

[app_lock_unlock_biometric]
tag = "WP-20"
reason = "OS-credential op (biometric_support/OS biometrics) explicitly named under WP-20; also single global state."

[backup_export]
tag = "WP-19"
reason = "dest_path is unconfined: PathBuf::from(dest_path) + create_dir_all(parent) + the zip write, no allowlist or data-dir check, so a token holder could write a zip anywhere the daemon can (backup_list / backup_delete are served only because they stay inside <data-dir>/backups). include_secrets also reads the desktop Stronghold vault through SecretsLock, which the daemon has no analog for. Needs a dest confined to <data-dir>/backups and a secrets story first."

[backup_import]
tag = "WP-19"
reason = "src_path is unconfined (PathBuf::from(src_path), no allowlist check). And what it produces, staged-restore/pa.db.new + RESTORE_PENDING, is only applied by desktop lib.rs .setup() (apply_staged_restore_if_present, pre-pool) on the next desktop launch; the daemon has no boot-apply step, so a served import would stage a restore that is never applied."

[bg_spike_reply]
tag = "desktop-only-forever"
reason = "Reply half of the same bg_spike_* debug harness; resolves a pending nonce from the native window's eval callback."

[bg_spike_run]
tag = "desktop-only-forever"
reason = "Phase 0.5 debug harness pinging the primary native webview window via eval round-trips; explicit 'debug spikes like bg_spike_*' example."

[claude_assets_discover]
tag = "WP-19"
reason = "discovery::discover reads the live pkg kernel's installed set (app.state::<KernelState>()) for tiers 2 and 4; the daemon runs no kernel (its --pkgs-dir PkgIndex is a read-only view, not an install record), so it could only answer tiers 1 and 3 — a partial tree that would read as complete. Not served in slice 5b."

[claude_config_unwatch]
tag = "WP-19"
reason = "Releases claude_config_watch's watcher ids; nothing to release while claude_config_watch is desktop-only (see its entry). Serve the pair together."

[claude_config_watch]
tag = "WP-19"
reason = "Registers FsWatchManager watchers that emit `claude-config:changed` on the Tauri event channel; the daemon has none (the web transport's listen() is a no-op, and /ws/fs is its own subscription protocol, not these watcher ids). Not served in slice 5b; needs an event channel first."

[db_export_ndjson]
tag = "WP-19"
reason = "dest_dir is unconfined (Path::new(&dest_dir), no allowlist or data-dir check): it writes one NDJSON file per table wherever the caller points. It also has no FE caller (no tauri-cmd.ts wrapper; only the wp06 round-trip unit test). Needs a contained destination before a remote client may drive it."

[db_import_ndjson]
tag = "WP-19"
reason = "src_dir is unconfined (no allowlist check), and import_ndjson_from_dir interpolates each file's filename-derived stem into SQL as the table name (INSERT OR REPLACE INTO \"{table}\" ...) with no check against the real schema, so a crafted filename can break out of the quoted identifier. No FE caller (test-only). Needs containment + a table allowlist first."

[detect_system]
tag = "WP-19"
reason = "Half of system::build_report is the desktop vault (secret index in app_data_dir + the platform keychain probe via SecretsLock); the daemon has no vault (crate::secrets_env), so secrets_store_ready / vault_key_present and their fix hint would describe a store that does not exist there. Needs a daemon-true report shape first."

