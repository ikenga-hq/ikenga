reason = "Pair of fs_watch: in a remote web session tauri-cmd.ts fsUnwatch releases the watch on the /ws/fs socket (server/fs_ws.rs); an RPC arm would have no watcher of its own to release."

[fs_watch]
tag = "desktop-only-forever"
reason = "A watch needs a push channel; the browser build never sends this verb — tauri-cmd.ts fsWatch goes over the daemon's /ws/fs socket (server/fs_ws.rs, per-event allowlist re-check) in a remote web session. An RPC arm would duplicate it with no way to deliver events."

