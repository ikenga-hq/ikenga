reason = "supervisor.restart() relaunches the SidecarSupervisor's long-lived child (lifecycle.rs spawn site) for a Blocked/Crashed/Parked entry. The daemon runs no SidecarSupervisor — it supervises no long-lived pkg children at all (pkg_sidecar_call is one-shot) — so there is no entry to restart."

[pkg_trust_approve]
