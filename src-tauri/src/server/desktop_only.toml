[session_cancel]
tag = "WP-19"
reason = "No live FE caller in src/. AppHandle-free itself (cancel_streaming signals the child), but it can only cancel a turn session_send started, and session_send cannot run on the daemon: claude/session.rs emits every ChatEvent through a bare app.emit (emit_events), and the daemon has no AppHandle. Nor does the daemon's /ws/chat/:id have a Claude Code engine (EngineHandle::ClaudeCode is cfg(feature=\"desktop\"), compiled out of ikenga-server). Served alone it would be a permanent no-op. Prerequisite: the on_update callback refactor engines/antigravity_acp already had."

[session_destroy]
tag = "WP-19"
reason = "No live FE caller in src/. Removes the SessionsState entry + cancel_streaming, which only means something for a session session_send drove, and session_send cannot run on the daemon: claude/session.rs emits through a bare app.emit (emit_events) and the daemon has no AppHandle; its /ws/chat/:id has no Claude Code engine either (EngineHandle::ClaudeCode is cfg(feature=\"desktop\")). Prerequisite: the on_update callback refactor engines/antigravity_acp already had."

[session_destroy_all]
tag = "WP-19"
reason = "No live FE caller in src/ (the doc comment's window-beforeunload caller does not exist: the only beforeunload listeners are terminal/session-store.ts and markdown-view.tsx). kill_all_streaming drains children only session_send starts, and session_send cannot run on the daemon: claude/session.rs emits through a bare app.emit (emit_events), the daemon has no AppHandle, and its /ws/chat/:id has no Claude Code engine (EngineHandle::ClaudeCode is cfg(feature=\"desktop\")). Prerequisite: the on_update callback refactor engines/antigravity_acp already had."

[session_ensure]
tag = "WP-19"
reason = "No live FE caller in src/. It only registers a thread (and an unconfined cwd) in SessionsState, which the daemon never constructs; the turn it prepares for is session_send, which cannot run on the daemon: claude/session.rs emits every ChatEvent through a bare app.emit (emit_events) and reads app.path().app_data_dir() for env layering, and the daemon has no AppHandle. Its /ws/chat/:id has no Claude Code engine (EngineHandle::ClaudeCode is cfg(feature=\"desktop\")). Prerequisite: the on_update callback refactor engines/antigravity_acp already had."

[session_send]
tag = "WP-19"
reason = "No live FE caller in src/. The spawn is executor-routed (WP-18), but the whole output path is claude/session.rs emit_events' bare app.emit on session://{thread_id} (+ a claude://session/{id} mirror), and the daemon has no AppHandle: served as-is the child would consume the prompt and the caller would never see a reply. The daemon's /ws/chat/:id has no Claude Code engine (EngineHandle::ClaudeCode is cfg(feature=\"desktop\"), compiled out of ikenga-server), and cwd is unconfined. Prerequisite: the on_update callback refactor engines/antigravity_acp already had (then a registry entry + a chat_ws run_turn arm + cwd through PathGuard)."

[session_tool_result]
tag = "WP-19"
reason = "No live FE caller in src/. It answers a tool round-trip mid-turn over the live child's stdin, but the request half reaches the FE only through claude/session.rs emit_events' bare app.emit, and the daemon has no AppHandle; its /ws/chat/:id has no Claude Code engine (EngineHandle::ClaudeCode is cfg(feature=\"desktop\")) and ChatClientMessage has no tool-result shape. Prerequisite: the on_update callback refactor engines/antigravity_acp already had."

