[runtime_retry_bun_fetch]
tag = "WP-19"
reason = "Its only FE-visible effect is the runtime://bun event: ensure_bun(&app, emit) narrates start/progress/ready/error through app.emit, and RuntimeBunChip (src/shell/runtime-bun-chip.tsx) renders null until an event arrives and has no poll fallback. The web transport's listen() is a no-op, so a served retry would run a real multi-second reqwest download + unpack server-side while the button that fired it shows nothing: no progress, no success, no error. ensure_bun is also AppHandle-shaped throughout (app_data_dir destination, SidecarSupervisorState wake). Needs a pollable status (or an event channel) first."

