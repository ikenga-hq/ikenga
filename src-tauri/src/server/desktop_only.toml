reason = "resolve_source_core clones into staging (git_clone / git_fetch_at_sha) or runs `npx skills add` — the same git/npx spawn sites as oba_install_git/npx; executor-routed (spawn_output_blocking), rpc.rs arm still pending."

[oba_update]
tag = "WP-18b"
reason = "update_core re-fetches via fetch_and_adopt/npx_skills_add_all — same git/npx spawn sites as install."

