reason = "No spawn, but not servable as-is: `path` is an unconfined read source (no PathGuard / allowlist check, only exists + is_dir), and the Local branch copies the whole located tree into the persisted store with an unchecked atomic_copy_dir, which follows symlinks inside it (std::fs::read) — a remote token holder could lift any directory the daemon uid can read. No FE caller (no tauri-cmd.ts wrapper); only the local iyke CLI bridge (POST /iyke/oba/install-local) uses it. Serve once the source goes through PathGuard as given and canonicalized and escaping links are refused, as claude_store_import's daemon arm does (WP-19 slice 7)."

[oba_install_npx]
tag = "WP-18b"
reason = "install_core->fetch_and_adopt calls npx_skills_add, which runs `npx`; executor-routed (spawn_output_blocking) since WP-18b part b, rpc.rs arm still pending."

