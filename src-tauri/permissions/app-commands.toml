# Ikenga app-command ACL manifest.
#
# WHY THIS FILE EXISTS (ikenga#140):
# The main window (and every detached window) loads REMOTE content —
# `http://localhost:<viewer_port>/`, see `src-tauri/src/lib.rs` — because the
# shell must be same-origin with the viewer-server that serves `/__viewer/*`.
# Tauri treats that as `Origin::Remote`.
#
# Up to and including tauri 2.11.0 the ACL gate in `tauri/src/webview/mod.rs`
# read `if (plugin_command.is_some() || has_app_acl_manifest)` — the app's own
# `#[tauri::command]`s were NOT gated, whatever the origin. tauri 2.11.2 added
# `|| !is_local` to that condition ("ensures remote content can never reach
# custom commands unless an explicit `remote` capability has been configured
# for them"). We picked that up in 7ccf4e87 (2.11.0 -> 2.11.5, a Dependabot
# advisory sweep), and from v0.7.3 onward EVERY app command was rejected in
# release builds with `Command <name> not allowed by ACL`. Dev builds kept
# working because there the window URL equals `build.devUrl`, so the origin is
# Local. That is ikenga#140: no pty spawns, no `iyke_set_shell`, no
# `iyke_dom_done` — the whole frontend<->backend channel, dead.
#
# The existence of this file makes `has_app_manifest` true, which means app
# commands are now ACL-gated on LOCAL origins too. That is deliberate: a
# command missing from the list below fails in `bun run tauri dev` exactly as
# it fails in a release build, instead of only in front of users.
#
# MAINTENANCE: this list must stay in sync with `tauri::generate_handler![..]`
# in `src-tauri/src/lib.rs`. `bun run test:acl-parity`
# (scripts/check-acl-parity.ts) asserts that and runs in CI.

[[permission]]
identifier = "allow-app-commands"
description = """
Every command registered in `tauri::generate_handler!`. Granted to the
`main` window and to `detached-*` windows, both of which load the shell
frontend from the trusted local viewer-server. Deliberately NOT granted to
`pkg-*` webviews, which mount arbitrary third-party partner portals.
"""
commands.allow = [
