[[permission]]
identifier = "allow-iyke-browser-reply"
description = """
The single command a `pkg-*` child webview needs to reach: `iyke_browser_reply`,
which is itself gated by a 122-bit oneshot token per request so partner-site JS
cannot spoof an in-flight reply. Kept separate from `allow-app-commands` because
the pkg-browser capability's `remote.urls` is deliberately wide open.
"""
commands.allow = ["iyke_browser_reply"]
