name: CI

# Tiered CI. Typecheck + unit tests + `cargo check`/`cargo test` + browser e2e,
# but not all of it on every push:
#
#   fast tier  — every non-draft PR, scoped to what changed:
#                ACL parity always (seconds, no install); typecheck + unit
#                tests when TS changed; `cargo check` + the headless
#                (`--no-default-features` / ikenga-server) build, tests and
#                link gate when Rust changed.
#   full tier  — adds `cargo test` and the browser-mode frame e2e. Runs for
#                PRs into `main` (release PRs), PRs labelled `ci:full`, the
#                nightly schedule on `main`, and manual dispatch.
#
# Skipped entirely: draft PRs (marking ready runs it), docs-only changes, and
# pushes to `main` (the PR already ran; the nightly covers `main`).
#
# Deliberately does NOT build the Tauri bundle — that lives in release.yml
# and needs the platform SDKs and ~20 min of runner time.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design/**'
      - '*.png'
      - 'LICENSE'
  schedule:
    - cron: '23 2 * * *' # nightly, full tier on main
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete — cancel it. Labelling a
# PR with anything other than `ci:full` gets its own group so it never cancels
# a real run (the scope job then skips it).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci:full' && 'label' || 'run' }}
  cancel-in-progress: true

jobs:
  scope:
    name: Scope + ACL parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci:full'))
    outputs:
      ts: ${{ steps.filter.outputs.ts == 'true' || steps.mode.outputs.full == 'true' }}
      rust: ${{ steps.filter.outputs.rust == 'true' || steps.mode.outputs.full == 'true' }}
      headless: ${{ steps.filter.outputs.rust == 'true' || steps.filter.outputs.server == 'true' || steps.mode.outputs.full == 'true' }}
      full: ${{ steps.mode.outputs.full }}
    steps:
      - uses: actions/checkout@v6

      - name: Choose tier
        id: mode
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          full=false
          if [ "$EVENT" != pull_request ] || [ "$BASE" = main ] || grep -q '"ci:full"' <<<"$LABELS"; then
            full=true
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "tier: $([ "$full" = true ] && echo full || echo fast)" >> "$GITHUB_STEP_SUMMARY"

      - name: What changed
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ts:
              - 'src/**'
              - 'e2e/**'
              - 'scripts/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig*.json'
              - '*.config.ts'
              - 'biome.json'
              - '.github/**'
            rust:
              - 'src-tauri/**'
              - '.github/**'
            # The headless link gate script the `headless` job runs.
            server:
              - 'scripts/server/**'

      # Cheapest gate in the pipeline and the one that would have caught
      # ikenga#140. Since tauri 2.11.2, app commands are ACL-gated for the
      # shell's remote-origin main window, so a command registered in
      # `generate_handler!` but missing from
      # `src-tauri/permissions/app-commands.toml` is dead at runtime while
      # every compile-time gate stays green. The script uses only node
      # builtins, so it runs without an install.
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ACL parity (generate_handler! vs app-commands.toml)
        run: bun run test:acl-parity

  verify:
    name: Typecheck + tests
    needs: scope
    if: needs.scope.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout shell
        uses: actions/checkout@v6
        with:
          path: shell

      - uses: ./shell/.github/actions/setup-workspace
        with:
          token: ${{ secrets.WORKSPACE_DEPS_PAT || secrets.GITHUB_TOKEN }}

      - name: Typecheck
        working-directory: shell
        run: bun run typecheck

      # After typecheck so a compile break reports as a compile break rather
      # than as a wall of downstream test failures.
      - name: Unit tests
        working-directory: shell
        run: bun run test

  # Browser-mode frame harness (WP-19, DEC-27): Playwright drives the React
  # frame in headless Chromium over a `vite build` + `vite preview` of this
  # branch, with the Tauri host mocked at the IPC seam
  # (e2e/fixtures/tauri-mock.ts). Full tier only.
  e2e:
    name: Frame e2e (browser mode)
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout shell
        uses: actions/checkout@v6
        with:
          path: shell

      - uses: ./shell/.github/actions/setup-workspace
        with:
          token: ${{ secrets.WORKSPACE_DEPS_PAT || secrets.GITHUB_TOKEN }}

      # Browser binaries are not an npm dependency; fetch the Chromium build
      # that matches the installed @playwright/test, plus its apt deps.
      - name: Install Playwright Chromium
        working-directory: shell
        run: bunx playwright install --with-deps chromium

      - name: Frame e2e
        working-directory: shell
        run: bun run test:e2e

      - name: Upload e2e traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frame-e2e-results
          path: shell/node_modules/.cache/e2e-results
          if-no-files-found: ignore
          retention-days: 7

  # Rust side. `cargo check` whenever Rust changed; `cargo test` on the full
  # tier only. Not `tauri build` — verified that `tauri_build::build()` does
  # NOT require `frontendDist` to exist, so the frontend build is skipped.
  rust:
    name: cargo check + test
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout shell
        uses: actions/checkout@v6

      # WebKitGTK + GTK headers. ubuntu-22.04 (not -latest) to match the
      # Linux leg of release.yml, so a green check here means the same
      # headers the release build compiles against.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Keyed separately from release.yml's per-target caches. Only `main`
      # (the nightly) saves the cache; PR runs restore it, so PR churn can't
      # evict the warm entry.
      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ci-check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --message-format=short

      # Sibling repos the manifest-v5 parity + pkg-fleet tests read (WP-28).
      # `actions/checkout` can't write outside the workspace, so they land
      # under `_siblings/` and the tests are pointed there via env.
      - name: Checkout @ikenga/contract (fixtures)
        if: needs.scope.outputs.full == 'true'
        uses: actions/checkout@v6
        with:
          repository: ikenga-hq/ikenga-contract
          path: _siblings/contract
      - name: Checkout ikenga-pkgs (manifest fleet)
        if: needs.scope.outputs.full == 'true'
        uses: actions/checkout@v6
        with:
          repository: ikenga-hq/ikenga-pkgs
          path: _siblings/ikenga-pkgs

      # In-lib unit tests: every test in this crate is a `#[cfg(test)] mod`
      # inside src/, so `--lib` covers all of them. Reuses what the check step
      # built. Keep it scoped — widening to --all-targets risks runner disk
      # (check + test filled ~40 GB of target/ locally).
      - name: cargo test
        if: needs.scope.outputs.full == 'true'
        working-directory: src-tauri
        env:
          IKENGA_CONTRACT_DIR: ${{ github.workspace }}/_siblings/contract
          IKENGA_PKGS_DIR: ${{ github.workspace }}/_siblings/ikenga-pkgs
        run: cargo test --lib --no-fail-fast

  # Headless feature set: the `ikenga-desktop` lib without its default
  # `desktop` feature, and the `ikenga-server` daemon built on it. The `rust`
  # job only ever compiles the desktop feature set, which is how
  # `cargo test --lib --no-default-features` once stopped compiling unseen.
  #
  # Fast tier (whenever Rust changed), not full-tier-only like desktop
  # `cargo test`: without wry/WebKit it is a much smaller build than the
  # desktop test binary, its lib suite is a fraction of the desktop one, and
  # it runs in parallel on its own runner — so it adds no wall time to the
  # `rust` job and none of its target/ to that runner's disk. A headless
  # break is also invisible to every other fast-tier gate.
  #
  # No sibling checkouts: the only tests that read ikenga-contract /
  # ikenga-pkgs (`pkg::manifest_v5_parity`, `ikenga_pkgs_fleet_*`) are
  # `#[cfg(feature = "desktop")]`, so they are not compiled here.
  headless:
    name: headless build + test + link gate
    needs: scope
    if: needs.scope.outputs.headless == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout shell
        uses: actions/checkout@v6

      # Same headers as the `rust` job. Headless still COMPILES the gtk/glib
      # -sys crates (tauri's muda menu dep pulls them in regardless of
      # `wry`); it just must not LINK them — which the gate below asserts.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Its own key: a different feature set of the same crates, so sharing
      # `ci-check` would thrash it. Saved from `main` only, like `rust`.
      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ci-headless
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo build -p ikenga-server
        working-directory: src-tauri
        run: cargo build -p ikenga-server --message-format=short

      # The daemon must not link GTK/WebKit, or it won't start on a server.
      # Same script deploy.sh gates a release build with.
      - name: Headless link gate (no GTK/WebKit in ikenga-server)
        run: scripts/server/check-headless-link.sh src-tauri/target/debug/ikenga-server

      - name: cargo test --lib --no-default-features
        working-directory: src-tauri
        run: cargo test --lib --no-default-features --no-fail-fast

      - name: cargo test -p ikenga-server
        working-directory: src-tauri
        run: cargo test -p ikenga-server --no-fail-fast

  # T1 root tests (remote-access WP-20, G-PRINCIPAL §8/§9). The T1 executor
  # drops to per-principal uids, so its real tests need root — and, to prove
  # the floor (ADR-023: no privileged container), root with ONLY the
  # capabilities the T1 unit grants: SETUID, SETGID, CHOWN, KILL,
  # DAC_OVERRIDE, FOWNER. They run in a throwaway debian:stable-slim
  # container (they write its /etc), never on the runner itself.
  #
  # The `#[ignore = "t1-root"]` tests are skipped by every other job; here the
  # headless lib test binary runs them with `--ignored --test-threads=1
  # t1_root` (one thread: some flip a process-wide fault-injection flag).
  # Then `ikenga-server probe --executor-tier t1` must pass in that container
  # and must FAIL (exit 1) as a non-root user and without CAP_SETUID.
  t1-root:
    name: T1 root tests (minimal-capability container)
    needs: scope
    if: needs.scope.outputs.headless == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout shell
        uses: actions/checkout@v6

      # Same headers as `headless`: the gtk/glib -sys crates still compile.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Reads the `headless` cache (same feature set); never saves its own.
      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ci-headless
          save-if: false

      - name: Build the headless lib test binary and ikenga-server
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p ikenga-server --message-format=short
          tests=$(cargo test --lib --no-default-features --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true
                            and .target.name == "ikenga_desktop_lib") | .executable' | tail -1)
          test -x "$tests"
          # World-readable, outside the runner's home: the tests re-exec
          # these binaries as unprivileged probe/principal uids.
          sudo install -d -m 0755 /opt/t1
          sudo install -m 0755 "$tests" /opt/t1/lib-tests
          sudo install -m 0755 target/debug/ikenga-server /opt/t1/ikenga-server

      - name: t1_root tests (root, T1 capabilities only)
        run: >-
          docker run --rm
          --cap-drop=ALL --cap-add=SETUID,SETGID,CHOWN,KILL,DAC_OVERRIDE,FOWNER
          -v /opt/t1:/opt/t1:ro -w /tmp
          debian:stable-slim
          /opt/t1/lib-tests --ignored --test-threads=1 t1_root

      - name: probe passes with the T1 capabilities
        run: >-
          docker run --rm
          --cap-drop=ALL --cap-add=SETUID,SETGID,CHOWN,KILL,DAC_OVERRIDE,FOWNER
          -v /opt/t1:/opt/t1:ro -w /tmp
          debian:stable-slim
          /opt/t1/ikenga-server probe --executor-tier t1 --data-dir /srv/ikenga

      - name: probe refuses as non-root and without CAP_SETUID
        shell: bash
        run: |
          set -uo pipefail
          expect_refusal() {
            local what=$1; shift
            docker run --rm -v /opt/t1:/opt/t1:ro -w /tmp "$@" debian:stable-slim \
              /opt/t1/ikenga-server probe --executor-tier t1 --data-dir /tmp/t1
            local rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "::error::probe $what: expected exit 1, got $rc"
              return 1
            fi
            echo "probe $what: refused (exit 1), as required"
          }
          ok=0
          expect_refusal "as uid 1000" --user 1000 || ok=1
          expect_refusal "without CAP_SETUID" --cap-drop=SETUID || ok=1
          exit $ok
