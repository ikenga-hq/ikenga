name: Release

# Builds installers for macOS (ARM + Intel), Windows (x64), and Linux (x64)
# in parallel on each platform's native runner. Triggered by tag push (v*)
# or manual dispatch. Tag-triggered runs publish to a GitHub Release;
# dispatch runs upload artifacts only.
#
# The same tag also publishes the headless server: signed amd64 and arm64
# tarballs plus a release manifest (jobs `server-build` and `server`). See the
# "Server artifacts" section of docs/release-signing.md.
#
# Workspace layout in CI mirrors the local dev tree:
#   ikenga-hq/ikenga-contract  → contract/    (workspace:* in shell)
#   ikenga-hq/ikenga-tokens    → tokens/      (workspace:* in shell)
#   ikenga-hq/ikenga-pkgs      → ikenga-pkgs/ (canonical monorepo per ADR-009;
#                                               build materializes the engine-cc
#                                               dist into shell resources, and
#                                               scripts/build-iyke-mcp.sh bundles
#                                               from packages/mcp/iyke/)
#
# `@ikenga/pkg-engine-claude-code` is consumed from npm (shell pins ^0.2.0),
# not workspace-linked, since the cutover on 2026-05-18 retired its
# standalone clone.
#
# Setup before first run:
#   1. If any of contract / tokens / ikenga-pkgs go private, add a
#      fine-grained PAT with read access as `WORKSPACE_DEPS_PAT` secret
#      on ikenga-hq/ikenga. While all three are public, the default
#      GITHUB_TOKEN suffices.
#   2. Push a tag matching `v*` (e.g. `git tag v0.0.5 && git push origin v0.0.5`).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which platforms to build (comma-separated; default = all)'
        type: choice
        options:
          - all
          - linux-only
          - mac-only
          - windows-only
        default: all

env:
  CARGO_TERM_COLOR: always
  # vite transforms ~12.6k modules; Node's default 2GB heap OOMs on
  # macOS runners during post-transform. We set NODE_OPTIONS at the
  # workflow level so it propagates to every `bun run build` invocation
  # — including the second one tauri-action triggers via tauri.conf.json's
  # `beforeBuildCommand`. A step-level env on the standalone Vite step
  # alone isn't enough.
  NODE_OPTIONS: --max-old-space-size=4096
  # Note: GitHub's deprecation notice for Node 20 actions suggests
  # setting FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true here, but that
  # currently breaks the plan-job startup with no surfaced error
  # ("conclusion: failure" in 2 seconds, no steps logged). Will
  # revisit once GitHub stabilizes the opt-in path or the runners
  # default to Node.js 24 (2026-06-02). Until then we accept the
  # deprecation warnings — they don't affect builds.

jobs:
  # Build the matrix dynamically based on the dispatch input. GitHub
  # Actions doesn't expose `matrix.*` to job-level `if:` conditions, so
  # we can't filter legs after the fact — instead we synthesize the
  # JSON matrix here and feed it into the build job's
  # `strategy.matrix.include`. Tag-triggered runs default to `all` and
  # produce the full 4-leg matrix; manual dispatch narrows it.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      # Whether this run builds the Linux leg. The server artifacts reuse its
      # web bundle, so they are built only when it is.
      linux: ${{ steps.set.outputs.linux }}
    steps:
      - id: set
        shell: bash
        run: |
          input='${{ github.event.inputs.platforms }}'
          if [ -z "$input" ]; then input=all; fi
          echo "Selected platform set: $input"

          # Single macOS leg: one universal-apple-darwin build (Intel + Apple
          # Silicon in one .app) instead of two per-arch jobs. macOS runners
          # bill at a 10x minute multiplier even on public repos, so halving
          # the macOS job count removes a full runner's worth of duplicated
          # checkout + pnpm install + workspace/vite builds per release.
          mac='{"platform":"macos-latest","target":"universal-apple-darwin","arch_label":"macos-universal"}'
          windows='{"platform":"windows-latest","target":"x86_64-pc-windows-msvc","arch_label":"windows-x64"}'
          linux='{"platform":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","arch_label":"linux-x64"}'

          case "$input" in
            all)            include="[$mac,$windows,$linux]" ;;
            linux-only)     include="[$linux]" ;;
            mac-only)       include="[$mac]" ;;
            windows-only)   include="[$windows]" ;;
            *) echo "::error::unknown platforms input: $input"; exit 1 ;;
          esac

          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
          case "$input" in
            all|linux-only) echo "linux=true" >> "$GITHUB_OUTPUT" ;;
            *)              echo "linux=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: plan
    # `contents: write` so tauri-action can create the draft Release; the
    # WORKSPACE_DEPS_PAT used for sibling clones still needs its own scope.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    # 120, not 60: the universal-apple-darwin build compiles both arches and
    # took ~57 min on v0.18.3, so the macOS job timed out twice (run
    # 36705744371) after its artifacts had already uploaded.
    timeout-minutes: 120

    steps:
      # ── Checkout shell + sibling workspace repos ────────────────────────────
      - name: Checkout shell
        uses: actions/checkout@v6
        with:
          path: shell

      - name: Checkout @ikenga/contract
        uses: actions/checkout@v6
        with:
          repository: ikenga-hq/ikenga-contract
          path: contract
          token: ${{ secrets.WORKSPACE_DEPS_PAT || secrets.GITHUB_TOKEN }}

      - name: Checkout @ikenga/tokens
        uses: actions/checkout@v6
        with:
          repository: ikenga-hq/ikenga-tokens
          path: tokens
          token: ${{ secrets.WORKSPACE_DEPS_PAT || secrets.GITHUB_TOKEN }}

      # Canonical pkg monorepo (ADR-009). Provides:
      #   - The engine-cc dist that `bun run engine:cc:materialize` copies into
      #     shell resources.
      #   - The mcp-iyke source that scripts/build-iyke-mcp.sh bundles.
      # NOTE: this is a separate, self-contained pnpm workspace — we do not
      # add its packages to the synthesized outer workspace (pnpm doesn't
      # support nested workspaces).
      - name: Checkout ikenga-hq/ikenga-pkgs
        uses: actions/checkout@v6
        with:
          repository: ikenga-hq/ikenga-pkgs
          path: ikenga-pkgs
          token: ${{ secrets.WORKSPACE_DEPS_PAT || secrets.GITHUB_TOKEN }}

      # Synthesize the outer workspace so shell's two remaining workspace:*
      # deps (@ikenga/contract, @ikenga/tokens) resolve the same way they
      # do locally. @ikenga/pkg-engine-claude-code is consumed via npm
      # (^0.2.0) post-cutover, so it does NOT need a workspace entry here.
      - name: Synthesize workspace
        shell: bash
        run: |
          cat > pnpm-workspace.yaml <<'EOF'
          packages:
            - shell
            - contract
            - tokens
          EOF
          # This install has no lockfile, so every dependency floats. Pin
          # what upstream has broken: @codemirror/language 6.13.0
          # (2026-10-07) imports @codemirror/streamparser without declaring
          # it, which fails the vite build on every platform. The lockfile
          # (and so CI) is on 6.12.3. Drop the pin once upstream fixes it.
          cat > package.json <<'EOF'
          {
            "private": true,
            "pnpm": {
              "overrides": {
                "@codemirror/language": "<6.13.0"
              }
            }
          }
          EOF
          echo "Workspace layout:"
          ls -la

      # ── Toolchains ─────────────────────────────────────────────────────────
      # `universal-apple-darwin` is not a real rustc target — Tauri lipos two
      # real targets, so both must be installed for the universal build.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      # rust-cache keyed per matrix.target. With the macOS leg consolidated to
      # one universal target dir (was two per-arch dirs), the repo's total
      # target/ cache footprint drops below GitHub's 10 GB cache cap, so legs
      # stop evicting each other and warm-cache compiles actually hit.
      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # pnpm handles workspace:* resolution at the workspace root (matches
      # the local dev pattern — `pnpm install` at root, `bun run` from shell).
      # Without this step, bun install from shell/ doesn't walk up to find
      # the workspace and errors with "@ikenga/contract not found".
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Set up Node (for pnpm)
        uses: actions/setup-node@v6
        with:
          node-version: 20

      # Linux runner needs WebKit + GTK headers. macOS / Windows runners
      # ship the platform SDKs by default.
      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            xvfb

      # ── Frontend deps ──────────────────────────────────────────────────────
      # pnpm at workspace root creates the shell/node_modules/@ikenga/*
      # symlinks for the four sibling repos. Mirrors the local dev flow
      # (developer runs `pnpm install` at root, then `bun run X` from
      # shell/). --no-frozen-lockfile because the synthesized workspace
      # in CI is a subset of the local pnpm-lock.yaml's importers (we
      # don't clone cli/registry/cc-config — they're not part of the
      # shell build path).
      - name: pnpm install (workspace root)
        shell: bash
        run: pnpm install --no-frozen-lockfile

      # Build the workspace siblings' dist/ output. Each pkg gitignores its
      # dist (proper convention), and the shell type-imports via the
      # @ikenga/* package mains that point at ./dist.
      - name: Build outer workspace siblings (contract, tokens)
        shell: bash
        run: |
          for pkg in '@ikenga/contract' '@ikenga/tokens'; do
            echo "==> pnpm -F $pkg build"
            pnpm -F "$pkg" build
          done

      # ikenga-pkgs is its own pnpm workspace. Install + build its members
      # so the engine-cc dist exists for `bun run engine:cc:materialize` and
      # scripts/build-iyke-mcp.sh can bundle from packages/mcp/iyke/.
      # --ignore-scripts skips native postinstall builds. The shell needs only
      # the engine-cc dist and the iyke MCP bundle from this workspace, but a
      # plain install compiles every package's native deps — including
      # better-sqlite3, a runtime dep of packages/mcp/meetings. That compiles on
      # Linux and macOS and fails on Windows, where node-gyp's Visual Studio
      # probe dies with ERR_CHILD_PROCESS_STDIO_MAXBUFFER and then reports it as
      # "Could not find any Visual Studio installation to use".
      #
      # Nothing here needs the binding: `pnpm -r build` is tsc, which needs only
      # @types/better-sqlite3, and the meetings MCP materializes its own deps on
      # the user's machine at pkg install time.
      - name: Install + build ikenga-pkgs (nested workspace)
        shell: bash
        working-directory: ikenga-pkgs
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm -r build

      - name: Build iyke MCP binary
        shell: bash
        working-directory: shell
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/build-iyke-mcp.sh

      - name: Vite build (frontend dist)
        shell: bash
        working-directory: shell
        run: bun run build

      # The server tarballs ship the same web bundle the desktop app embeds.
      # Hand it to the `server` job instead of rebuilding it there: that job
      # has no sibling checkouts (contract, tokens, pkgs) to build it from.
      - name: Upload web bundle for the server artifacts (Linux leg)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: shell/dist
          if-no-files-found: error
          retention-days: 7

      # ── Optional code signing (opt-in via secrets) ───────────────────────
      # Both blocks below are inert until the maintainer creates the secrets
      # listed in docs/release-signing.md. With none configured, each leg
      # builds unsigned exactly as it always has.

      # macOS: forward each APPLE_* variable to later steps via $GITHUB_ENV
      # ONLY when the corresponding secret is non-empty. This is load-bearing:
      # Tauri reads these vars with `var_os`, which treats an EMPTY STRING as
      # "set" — unconditionally forwarding "" would make the bundler call
      # codesign with an empty identity and fail the leg. With no secrets
      # configured nothing is exported and the artifacts are byte-for-byte
      # what they were before.
      - name: Export Apple signing env (macOS, only non-empty secrets)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # Heredoc-delimiter syntax because some values span multiple lines
          # (the base64 .p12 and the .p8 private key both contain newlines).
          export_if_set() {
            local name="$1" value="$2" delim
            if [ -z "$value" ]; then return 0; fi
            delim="ghadelim_${name}_$(openssl rand -hex 8)"
            {
              printf '%s<<%s\n' "$name" "$delim"
              printf '%s\n' "$value"
              printf '%s\n' "$delim"
            } >> "$GITHUB_ENV"
            echo "exported $name"
          }

          # No keychain import needed here: tauri-bundler imports
          # APPLE_CERTIFICATE (decrypting with APPLE_CERTIFICATE_PASSWORD)
          # into its own temporary keychain when both are set
          # (bundle/macos/sign.rs keychain()). APPLE_SIGNING_IDENTITY then
          # selects which identity codesign uses.
          export_if_set APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
          export_if_set APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          export_if_set APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"

          # Notarization credentials — App Store Connect API key preferred,
          # Apple ID as the alternative. Tauri needs APPLE_API_KEY_PATH to be
          # a real file, so the .p8 secret (the file's contents) is written
          # to disk and its path exported — only when both halves exist.
          export_if_set APPLE_API_KEY "$APPLE_API_KEY"
          export_if_set APPLE_API_ISSUER "$APPLE_API_ISSUER"
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            KEY_FILE="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_FILE"
            echo "APPLE_API_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"
            echo "exported APPLE_API_KEY_PATH=$KEY_FILE"
          fi
          export_if_set APPLE_ID "$APPLE_ID"
          export_if_set APPLE_PASSWORD "$APPLE_PASSWORD"
          export_if_set APPLE_TEAM_ID "$APPLE_TEAM_ID"

      # Windows: Azure Artifact Signing (née Trusted Signing). The signed
      # `bundle.windows.signCommand` is injected via `tauri build --config`
      # — never committed to tauri.conf.json, so contributor `tauri build`s
      # keep working unsigned. artifact-signing-cli (Rust reimplementation
      # of signtool+Azure auth, what the Tauri docs recommend) is only
      # compiled when all six Azure values exist. The three credentials are
      # secrets; the endpoint/account/profile are non-sensitive and live in
      # repo *variables* (`vars.*`) — also fine as secrets if preferred.
      - name: Configure Azure Artifact Signing (Windows, if configured)
        id: windows_sign
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERT_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERT_PROFILE }}
        run: |
          set -euo pipefail
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET \
                   AZURE_ARTIFACT_SIGNING_ENDPOINT AZURE_ARTIFACT_SIGNING_ACCOUNT \
                   AZURE_ARTIFACT_SIGNING_CERT_PROFILE; do
            if [ -z "${!v:-}" ]; then
              echo "Azure Artifact Signing not configured ($v is empty) — building unsigned."
              exit 0
            fi
          done
          cargo install artifact-signing-cli
          SIGN_CMD="artifact-signing-cli -e $AZURE_ARTIFACT_SIGNING_ENDPOINT -a $AZURE_ARTIFACT_SIGNING_ACCOUNT -c $AZURE_ARTIFACT_SIGNING_CERT_PROFILE -d Ikenga %1"
          # Written inside shell/ (the tauri-action projectPath) so the
          # --config path is a bare filename — no quoting/space issues when
          # tauri-action tokenizes `args`.
          jq -nc --arg cmd "$SIGN_CMD" '{bundle:{windows:{signCommand:$cmd}}}' \
            > shell/ci-windows-sign-config.json
          cat shell/ci-windows-sign-config.json
          echo "config_args=--config ci-windows-sign-config.json" >> "$GITHUB_OUTPUT"

      # ── Tauri bundle ───────────────────────────────────────────────────────
      # ── Build + sign + (on tag push) publish a draft Release ──────────────
      # tauri-action runs `tauri build`, signs the installer with
      # TAURI_SIGNING_PRIVATE_KEY, generates the per-platform .sig +
      # latest.json updater artifacts (because bundle.createUpdaterArtifacts
      # is true in tauri.conf.json), and on tag push attaches everything to
      # a draft GitHub Release. Matrix jobs share the same tag and append
      # their platform's assets to the same draft.
      #
      # On workflow_dispatch we don't pass `tagName` — tauri-action still
      # builds + signs and exits with `artifactPaths`, which the next step
      # attaches as a workflow-run artifact for download via the UI.
      #
      # The APPLE_* vars arrive via $GITHUB_ENV from the export step above —
      # only the non-empty ones — so with no secrets configured Tauri sees
      # exactly the environment it always has and builds unsigned. Azure
      # signing is injected through `args` by the windows_sign step instead.
      - name: Build + sign + release (tauri-action)
        id: tauri_action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: shell
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: 'Ikenga v__VERSION__'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} ${{ steps.windows_sign.outputs.config_args }}

      # Launch smoke gate — the only check in this pipeline that STARTS the app.
      #
      # Everything else verifies that the code compiles and its units pass.
      # v0.8.0 shipped with a dead iyke FE⇄backend channel and no terminal
      # could spawn, while typecheck, both cargo checks, 786 Rust tests, 804
      # frontend tests, CI and all four release legs were green (ikenga#140).
      # `GET /iyke/dom` round-trips backend -> FE listener -> invoke -> backend,
      # so it fails on exactly that break. Verified by execution against both
      # builds: passes on v0.7.2, fails on v0.8.0 with
      # `iyke://dom-request timed out after 5000ms`.
      #
      # Linux leg only: it needs a webview and a display, and the bug it guards
      # is platform-independent, so one leg is enough to catch it.
      #
      # On failure this job fails, `notes` (needs: build) never runs, and the
      # release stays a DRAFT. That is the intended safe state — a build that
      # cannot open a terminal must never become `Latest` (ikenga#141).
      - name: Launch smoke gate (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: shell
        run: |
          # The explicit screen size matters. xvfb-run's default is 640x480,
          # and at that size the workspace lays out but a terminal pane never
          # mounts its xterm — verified by execution: the same build that
          # spawns `bash -l` and echoes a command back at 1600x1000 leaves the
          # PTY unattached at 640x480. /iyke/dom does not depend on it today,
          # but anything added to this gate that touches a pane would.
          xvfb-run -a -s "-screen 0 1600x1000x24" dbus-run-session -- \
            bun run scripts/launch-smoke-gate.ts \
              --binary="src-tauri/target/${{ matrix.target }}/release/ikenga-desktop" \
              --timeout-sec=120

      # Workflow-dispatch runs don't publish a release — surface the built
      # installers as a workflow-run artifact so the UI download still works.
      - name: Upload installers as workflow artifact (dispatch only)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ikenga-${{ matrix.arch_label }}
          path: |
            shell/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            shell/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            shell/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            shell/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            shell/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            shell/src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
            shell/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
            shell/src-tauri/target/${{ matrix.target }}/release/bundle/**/latest.json
          if-no-files-found: error
          retention-days: 14

  # ── Server artifacts ───────────────────────────────────────────────────────
  # Cross-links `ikenga-server` for amd64 and arm64 against a pinned glibc
  # floor, then signs and attests the tarballs and a release manifest. Both
  # architectures build on a native runner, so the link and `--version` gates
  # actually execute the binary they ship.
  #
  # The release is published by `notes`, which needs `server`: a tag whose
  # server artifacts failed stays a draft rather than going out without them.
  server-build:
    name: server build (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout shell
        uses: actions/checkout@v6

      - uses: ./.github/actions/build-server
        with:
          arch: ${{ matrix.arch }}
          expect-version: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && github.ref_name || '' }}

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-bin-${{ matrix.arch }}
          path: server-bin/ikenga-server-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  server:
    name: server tarballs, manifest, signatures
    needs: [plan, build, server-build]
    if: needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # attach assets to the draft release
      id-token: write # keyless signing and build provenance
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout shell
        uses: actions/checkout@v6

      - name: Download web bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: server-dist
          path: server-dist

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: server-bin-*
          path: server-bin
          merge-multiple: true

      # A tag push names its release; a dispatch run takes the crate's own
      # version so the same steps can be exercised without a tag.
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' src-tauri/server/Cargo.toml | head -n 1)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack tarballs and write the manifest
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          scripts/server/package-server.sh pack \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --bin-dir server-bin \
            --dist server-dist \
            --out server-out
          ls -l server-out

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Keyless: the signature binds to this workflow's OIDC identity, so no
      # signing key exists to store or rotate. It is separate from the updater
      # key and from the registry's key. Each bundle is verified straight away
      # against the exact identity of this run, so a misconfigured signer fails
      # here and not on a user's machine.
      - name: Sign with cosign (keyless)
        shell: bash
        run: |
          set -euo pipefail
          cd server-out
          for f in ikenga-server_*.tar.gz ikenga-server_*_manifest.json; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "https://github.com/$REPO/.github/workflows/release.yml@$GITHUB_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$f"
          done
          ls -l

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            server-out/ikenga-server_*.tar.gz
            server-out/ikenga-server_*_manifest.json

      # Tag pushes attach to the draft release the build job created; `notes`
      # publishes it and `checksums` hashes everything, these files included.
      # Dispatch runs have no release, so they keep the files as a workflow
      # artifact instead.
      - name: Attach to the release
        if: github.event_name == 'push'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" server-out/* --repo "$REPO" --clobber

      - name: Upload server artifacts (dispatch only)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ikenga-server
          path: server-out/*
          if-no-files-found: error
          retention-days: 14

  # ── Release publication ────────────────────────────────────────────────────
  # `tauri-apps/tauri-action` in the build job creates the draft GitHub
  # Release inline on tag push (one per matrix platform appends its
  # assets + .sig to the same draft). Workflow_dispatch runs upload the
  # bundles as workflow-run artifacts instead.
  #
  # The `notes` job below runs after the matrix completes and backfills:
  #   1. The GH Release body — a categorized commit log between the previous
  #      tag and this tag, grouped by conventional-commit prefix
  #      (feat / fix / refactor / etc.), plus a compare-link footer.
  #   2. The `notes` field inside `latest.json` (what the in-app updater UI
  #      shows). `latest.json` itself isn't signed — only the bundles
  #      referenced inside it are — so re-uploading with edited notes is
  #      safe and doesn't require the signing key.
  #
  # Why git log instead of GitHub's generate-notes API: this repo commits
  # directly to main (no PR-per-feature workflow), so generate-notes returns
  # only the "Full Changelog" link with no body. Conventional-commit
  # prefixes give us enough structure to group commits ourselves.
  #
  # If you'd rather hand-curate the body, run
  # `gh release edit vX.Y.Z --notes-file path/to/notes.md` after the
  # release publishes; that overrides whatever this job wrote.
  notes:
    needs: [build, server]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout shell (full history for git log)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate + apply release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # Previous tag (the one immediately before $TAG in tag history).
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            echo "::warning::no previous tag found; using full history"
            RANGE="HEAD"
          else
            RANGE="${PREV}..${TAG}"
          fi

          # Group commits by conventional-commit prefix. Falls into
          # "Other" when the message doesn't start with a recognized prefix.
          BODY_FILE=/tmp/body.md
          {
            echo "# Ikenga $TAG"
            echo ""
            COUNT=$(git log "$RANGE" --pretty="%s" | wc -l)
            if [ -n "$PREV" ]; then
              echo "$COUNT commits since $PREV."
            else
              echo "$COUNT commits."
            fi
            echo ""

            for section in 'feat:Features' 'fix:Fixes' 'refactor:Refactors' 'perf:Performance' 'docs:Docs' 'test:Tests' 'ci:CI / Build' 'build:CI / Build' 'chore:Chores'; do
              prefix="${section%%:*}"
              title="${section##*:}"
              entries=$(git log "$RANGE" --pretty="- %s" | grep -E "^- ${prefix}(\(|:)" || true)
              if [ -n "$entries" ]; then
                echo "## $title"
                echo ""
                printf '%s\n\n' "$entries"
              fi
            done

            # Anything that didn't match any prefix above.
            other=$(git log "$RANGE" --pretty="- %s" | grep -vE "^- (feat|fix|refactor|perf|docs|test|ci|build|chore)(\(|:)" || true)
            if [ -n "$other" ]; then
              echo "## Other"
              echo ""
              printf '%s\n\n' "$other"
            fi

            echo "---"
            echo ""
            echo "**Full Changelog:** https://github.com/$REPO/compare/${PREV:-}...${TAG}"
            echo ""
            echo "## Install"
            echo ""
            echo '```bash'
            echo "# macOS / Linux — AppImage (portable)"
            echo "curl -fsSL https://ikenga.dev/install.sh | sh"
            echo ""
            echo "# Linux — system-wide .deb"
            echo "curl -fsSL https://ikenga.dev/install.sh | IKENGA_FORMAT=deb sh"
            echo ""
            echo "# Windows — Git Bash / MSYS / Cygwin"
            echo "curl -fsSL https://ikenga.dev/install.sh | sh"
            echo '```'

            # The multi-user server. The glibc floor is read from the release
            # manifest, the one place it is recorded.
            FLOOR=$(gh release download "$TAG" --repo "$REPO" -p '*_manifest.json' -O - \
              | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).glibc_floor)')
            SERVER_VERSION="${TAG#v}"
            echo ""
            echo "## Server"
            echo ""
            echo "The multi-user server for Linux (amd64 and arm64, glibc ${FLOOR} or newer) is attached as"
            echo "\`ikenga-server_${SERVER_VERSION}_linux_<arch>.tar.gz\`. Each tarball holds the binary, the web app"
            echo "and the systemd units. \`ikenga-server_${SERVER_VERSION}_manifest.json\` lists them with their digests."
            echo ""
            echo "Verify a download against the signature this release workflow made:"
            echo ""
            echo '```bash'
            echo "cosign verify-blob --bundle ikenga-server_${SERVER_VERSION}_linux_amd64.tar.gz.sigstore.json \\"
            echo "  --certificate-identity-regexp '^https://github.com/ikenga-hq/ikenga/.github/workflows/release.yml@refs/tags/v' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  ikenga-server_${SERVER_VERSION}_linux_amd64.tar.gz"
            echo "gh attestation verify ikenga-server_${SERVER_VERSION}_linux_amd64.tar.gz -R ikenga-hq/ikenga"
            echo '```'
          } > "$BODY_FILE"

          # Write the body AND flip the draft to published in one call —
          # tauri-action leaves the release as a draft so the per-platform
          # build jobs can attach assets atomically; we promote it now that
          # all assets are in and the body is final.
          gh release edit "$TAG" --repo "$REPO" --notes-file "$BODY_FILE" --draft=false

          # Short summary for latest.json (in-app updater UI). Take the
          # commit-count line + the first feat (if any) + a pointer.
          SHORT=$(printf 'Ikenga %s — %s See %s for full notes.' \
            "$TAG" \
            "$(awk 'NR==3' "$BODY_FILE")" \
            "https://github.com/$REPO/releases/tag/$TAG")

          # Rebuild latest.json from scratch, here, serially. Each matrix
          # build job runs tauri-action with includeUpdaterJson, and every
          # one does a read-modify-write of the SAME latest.json on the
          # shared draft release. Running concurrently, they clobber each
          # other (lost updates) and the published manifest ends up missing
          # whichever platforms lost the race — breaking auto-update for
          # those users. So we don't trust the survivor: we download every
          # per-platform .sig attached to the release and reconstruct the
          # full platform map deterministically from the known bundle names.
          VERSION="${TAG#v}"
          BASE="https://github.com/$REPO/releases/download/$TAG"
          SIGDIR=$(mktemp -d)
          gh release download "$TAG" --repo "$REPO" -p '*.sig' -D "$SIGDIR"

          # Writes a real file named latest.json (not a mktemp name) so we
          # never leave a stray tmp.*.json asset on the release.
          node -e '
            const fs = require("fs"), path = require("path");
            const [dir, base, version, notes] = process.argv.slice(1);
            const has  = f => fs.existsSync(path.join(dir, f));
            const read = f => fs.readFileSync(path.join(dir, f), "utf8").trim();
            // [updater platform key, .sig filename, bundle filename]
            //
            // tauri-plugin-updater resolves `{os}-{arch}-{installer}` FIRST,
            // then falls back to `{os}-{arch}`. The installer suffix comes
            // from the bundle type stamped into the running binary at build
            // time — so a deb-installed shell looks for `linux-x86_64-deb`.
            // Without that key it fell back to `linux-x86_64`, downloaded
            // the AppImage, and install_deb rejected it (InvalidUpdaterFormat)
            // AFTER the progress bar completed. The deb + deb.sig are already
            // built and attached (createUpdaterArtifacts signs them); list them.
            // macOS is now a single universal-apple-darwin .app. The exact
            // updater filename for a universal build (e.g. Ikenga.app.tar.gz vs
            // Ikenga_universal.app.tar.gz) varies by toolchain version, so we
            // resolve it from the actual .sig attached to the release rather
            // than hard-coding — a wrong name here silently breaks auto-update.
            // Both arch keys (and their -app fallbacks) point at the one
            // universal bundle so existing Intel + Apple-Silicon installs keep
            // updating from the same artifact.
            const macSig = fs.readdirSync(dir).find(f => f.endsWith(".app.tar.gz.sig"));
            if (!macSig) console.log("::warning::no macOS .app.tar.gz.sig on release — darwin updater entries skipped");
            const macBundle = macSig ? macSig.replace(/\.sig$/, "") : null;
            const darwin = macSig ? [
              ["darwin-aarch64",      macSig, macBundle],
              ["darwin-aarch64-app",  macSig, macBundle],
              ["darwin-x86_64",       macSig, macBundle],
              ["darwin-x86_64-app",   macSig, macBundle],
            ] : [];
            const map = [
              ...darwin,
              ["windows-x86_64",      "Ikenga_" + version + "_x64-setup.exe.sig",  "Ikenga_" + version + "_x64-setup.exe"],
              ["windows-x86_64-nsis", "Ikenga_" + version + "_x64-setup.exe.sig",  "Ikenga_" + version + "_x64-setup.exe"],
              ["linux-x86_64",        "Ikenga_" + version + "_amd64.AppImage.sig", "Ikenga_" + version + "_amd64.AppImage"],
              ["linux-x86_64-deb",    "Ikenga_" + version + "_amd64.deb.sig",      "Ikenga_" + version + "_amd64.deb"],
            ];
            const platforms = {};
            for (const [key, sig, bundle] of map) {
              if (has(sig)) platforms[key] = { signature: read(sig), url: base + "/" + bundle };
              else console.log("::warning::no .sig for updater platform " + key + " (" + sig + ")");
            }
            const out = { version, notes, pub_date: new Date().toISOString(), platforms };
            fs.writeFileSync("latest.json", JSON.stringify(out, null, 2) + "\n");
            console.log("latest.json platforms: " + Object.keys(platforms).join(", "));
          ' "$SIGDIR" "$BASE" "$VERSION" "$SHORT"

          gh release upload "$TAG" latest.json --repo "$REPO" --clobber

          echo "✓ Release notes + complete updater manifest applied to $TAG"

  # ── SHA256 checksums ───────────────────────────────────────────────────────
  # Final job. Runs strictly after `notes` so the sums cover EVERY published
  # asset — installers, updater artifacts (.sig, latest.json), the lot —
  # rather than racing whichever assets had landed when it ran.
  #
  # Idempotent on re-runs: the downloaded SHA256SUMS.txt is deleted before
  # hashing (a checksum file can't list itself), and `gh release upload
  # --clobber` replaces the previous copy. Re-running the job therefore just
  # rewrites the same file over the same asset set.
  checksums:
    needs: notes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Attach SHA256SUMS.txt covering every release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          DIR=$(mktemp -d)
          gh release download "$TAG" --repo "$REPO" --dir "$DIR" --clobber
          cd "$DIR"
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$REPO" --clobber
          echo "✓ SHA256SUMS.txt attached to $TAG"

  # ── Tell ikenga.dev a release shipped (truth-sync) ─────────────────────
  # Its own job after `checksums`, the final asset job, so the site rebuild
  # sees the published release with every asset and SHA256SUMS.txt in place.
  notify-site:
    needs: checksums
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ── Tell ikenga.dev a release shipped (truth-sync) ─────────────────────
      # Final step on purpose: it runs only after the release is published
      # (`--draft=false` above) and latest.json is re-uploaded, so the site
      # rebuild fetches this tag's assets rather than the previous release's.
      # It sends `repository_dispatch` (event_type `release`) to
      # ikenga-hq/ikenga-site, whose `truth-rebuild.yml` then triggers the
      # Cloudflare Pages build that refreshes downloads, install docs and the
      # changelog.
      #
      # Founder setup, one time (the token is never echoed, and GitHub masks it
      # in logs):
      #   1. Create a fine-grained personal access token. Resource owner:
      #      ikenga-hq. Repository access: only ikenga-hq/ikenga-site.
      #      Repository permissions: Contents = Read and write (that is what
      #      POST /repos/{owner}/{repo}/dispatches requires). Nothing else.
      #      If the org requires approval for fine-grained tokens, approve it.
      #   2. Save it as the Actions secret SITE_DISPATCH_TOKEN on
      #      ikenga-hq/ikenga (Settings -> Secrets and variables -> Actions).
      #   3. Put its expiry in the calendar. After it lapses this step only
      #      warns, and the nightly rebuild is the backstop (a rebuild up to a
      #      day late, not none).
      #
      # Never fails the release: the release is already public by now, so a
      # missing or rejected token surfaces as a warning annotation instead.
      - name: Notify ikenga.dev (repository_dispatch to ikenga-site)
        env:
          # The token is passed through the environment only, never on a
          # command line.
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning title=ikenga.dev not notified::SITE_DISPATCH_TOKEN is not set on this repo, so ikenga-site was not told about ${TAG}. The nightly rebuild will pick it up. Setup steps are in the comment above this step in release.yml."
            exit 0
          fi

          if gh api --method POST repos/ikenga-hq/ikenga-site/dispatches \
            -f event_type=release \
            -f "client_payload[source]=${SOURCE_REPO}" \
            -f "client_payload[tag]=${TAG}" \
            -f "client_payload[version]=${TAG#v}" \
            -f "client_payload[sha]=${SOURCE_SHA}" \
            -f "client_payload[run_url]=${RUN_URL}" \
            --silent; then
            echo "Dispatched event_type=release to ikenga-hq/ikenga-site for ${TAG}"
          else
            echo "::warning title=ikenga.dev dispatch failed::GitHub rejected the repository_dispatch to ikenga-hq/ikenga-site for ${TAG}. Check that SITE_DISPATCH_TOKEN is current and has Contents: write on that repo. The nightly rebuild will pick the release up."
          fi
