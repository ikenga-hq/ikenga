name: Build ikenga-server for one architecture
description: >-
  Cross-link the headless server with cargo-zigbuild against the pinned glibc
  floor (see scripts/server/package-server.sh), run its gates, and stage the
  binary as ikenga-server-linux-<arch> in out-dir. Run it on a runner of the
  matching architecture so the link and --version gates can execute the
  binary. Expects the repository checked out at the workspace root.

inputs:
  arch:
    description: amd64 or arm64.
    required: true
  out-dir:
    description: Directory the staged binary is written to.
    required: false
    default: server-bin
  expect-version:
    description: Version `ikenga-server --version` must print. Defaults to the crate version.
    required: false
    default: ''
  cache-save:
    description: Whether to save the cargo cache at the end of the job ('true' or 'false').
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # Headless still COMPILES the gtk/webkit -sys crates (tauri's menu crate
    # pulls them in regardless of the webview feature), so their headers must
    # be present for the build; the link gate then proves none of it is linked.
    - name: Install Linux build deps
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri -> target
        key: server-${{ inputs.arch }}
        save-if: ${{ inputs.cache-save }}

    - name: Install zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.14.1

    - name: Install cargo-zigbuild
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-zigbuild@0.23.4

    - name: Build, gate and stage ikenga-server (${{ inputs.arch }})
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        OUT_DIR: ${{ inputs.out-dir }}
        EXPECT_VERSION: ${{ inputs.expect-version }}
      run: |
        set -euo pipefail
        args=(build "$ARCH" --out "$GITHUB_WORKSPACE/$OUT_DIR")
        if [ -n "$EXPECT_VERSION" ]; then args+=(--expect-version "$EXPECT_VERSION"); fi
        scripts/server/package-server.sh "${args[@]}"
